replicaCount: 1

image:
  repository: "421438965568.dkr.ecr.us-east-1.amazonaws.com/eks-kubernetes-cicd-app"
  tag: "c3df150-1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50


ingress:
  enabled: true
  scheme: internet-facing
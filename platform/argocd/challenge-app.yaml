apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: challenge-app-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:uzobola/eks-kubernetes-cicd-platform.git
    targetRevision: gitops
    path: helm/challenge-app

    helm:
      releaseName: challenge-app

  destination:
    server: https://kubernetes.default.svc
    namespace: challenge-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
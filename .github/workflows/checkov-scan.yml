name: checkov-scan

on: workflow_dispatch
permissions:
  contents: read
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install checkov==3.3.8
      - name: Checkov (Terraform)
        run: checkov --directory terraform --framework terraform --compact
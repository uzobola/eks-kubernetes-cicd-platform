name: oidc-negative-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt role assumption and capture the denial
        shell: bash
        env:
          ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/eks-kubernetes-cicd-github-actions-role
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)

          set +e
          OUT=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name negative-test \
            --web-identity-token "$TOKEN" 2>&1)
          RC=$?
          set -e

          echo "$OUT" | sed -E 's/[0-9]{12}/************/g'

          if [ $RC -eq 0 ]; then
            echo "SECURITY TEST FAILED: role was assumed from a non-approved ref"
            exit 1
          fi

          if echo "$OUT" | grep -q "AccessDenied"; then
            echo "SECURITY TEST PASSED: denied by trust policy"
          else
            echo "SECURITY TEST FAILED: denied for an unexpected reason"
            exit 1
          fi

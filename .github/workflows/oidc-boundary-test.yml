name: oidc-boundary-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - name: Show test context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/eks-kubernetes-cicd-github-actions-role
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Verify AWS role assumption
        run: |
          aws sts get-caller-identity >/dev/null
          echo "PASS: trusted GitHub identity successfully assumed the AWS role."

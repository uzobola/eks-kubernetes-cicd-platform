name: oidc-boundary-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - name: Show test context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::421438965568:role/eks-kubernetes-cicd-github-actions-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
